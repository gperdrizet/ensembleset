[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ensembleset"
version = "1.0-alpha.19"
authors = [
  { name="George Perdrizet", email="george@perdrizet.org" },
]
description = "Ensemble dataset generator for tabular data prediction and modeling projects."
readme = "README.md"
license = {text = "GPLv3"}
license-files = ["LICEN[CS]E*"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["optimization", "ensemble-learning", "ensemble-techniques", "feature-engineering", "machine-learning", "data-science"]

dependencies = [
  "h5py==3.15.1",
  "numpy==2.3.5",
  "pandas==2.3.3",
  "scikit-learn==1.7.2"
]

dev = [
    "ipykernel"
]

[project.urls]
Homepage = "https://github.com/gperdrizet/ensembleset"
Repository = "https://github.com/gperdrizet/ensembleset"
Issues = "https://github.com/gperdrizet/ensembleset/issues"
PyPI = "https://pypi.org/project/ensembleset"
